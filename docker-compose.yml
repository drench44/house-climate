# Every service caps its json-file log (10 MB x 5 files) so a chatty or
# crash-looping container cannot fill the disk. The default json-file driver
# keeps logs forever.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # Pinned on purpose: a floating `latest-pg16` tag could silently jump a
    # TimescaleDB (or Postgres) major on a `docker compose pull` and demand a
    # migration mid-outage. To upgrade, bump this deliberately and test a
    # restore first.
    image: timescale/timescaledb:2.29.1-pg16
    environment:
      # local-trust credentials: the DB port is published on loopback only
      POSTGRES_USER: climate
      POSTGRES_PASSWORD: climate
      POSTGRES_DB: climate
    volumes:
      - climate_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/aggregates.sql:/docker-entrypoint-initdb.d/20-aggregates.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climate"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    # No mem_limit on the database, on purpose. The image's timescaledb-tune
    # sizes shared_buffers (25% of the HOST's RAM) and maintenance_work_mem
    # (up to 2 GB) once, at initdb, from whatever memory it saw then, and
    # Postgres assumes that memory is really there. A cgroup limit below those
    # settings gets a backend OOM-killed in the middle of a write or a vacuum
    # (Postgres then restarts every connection and replays WAL), which is a
    # worse outcome than the runaway it guards against. A limit that is safe
    # for every host would have to exceed shared_buffers + maintenance_work_mem,
    # so it would not protect anything. To cap it, lower those two settings
    # first (postgresql.conf in the volume), then add a limit well above them.

  poller:
    build: { context: ., dockerfile: poller.Dockerfile }
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    # Weather comes from config.json's weather_url (a container name if the
    # weather service shares a docker network with this stack), falling back
    # automatically to weather_url_fallback (a LAN URL). Both optional —
    # the poller runs fine with no weather source at all.
    # Liveness: the poll loop writes a heartbeat each tick; this probe marks
    # the container unhealthy if it goes stale, so a wedged poller or a
    # bad-credentials boot loop stops masquerading as healthy. Compose does
    # NOT restart an unhealthy container; an external watchdog must act on
    # it. start_period covers first-tick device discovery. Tune
    # POLLER_HEARTBEAT_MAX_AGE_S for slow poll intervals.
    healthcheck:
      test: ["CMD-SHELL", "python -m house_climate.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    logging: *default-logging
    # Measured peak on a running install: about 60 MiB (cgroup memory.peak,
    # page cache included). About 4x headroom, so a slow tick or a big
    # Daikin answer never trips it. memswap_limit = mem_limit: no swap on
    # top, so the limit is the real ceiling. A container over it is
    # OOM-killed and restarted (restart: unless-stopped), never left wedged.
    mem_limit: 256m
    memswap_limit: 256m

  web:
    build: { context: ., dockerfile: web.Dockerfile }
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    # CLIMATE_BIND (in .env) pins the dashboard to one LAN interface.
    # There is NO auth — never expose it beyond your LAN. See README.
    # Default is loopback (fail CLOSED): if .env omits CLIMATE_BIND, the
    # dashboard is reachable only from the host, not published to every
    # interface. Set CLIMATE_BIND to your LAN IP to actually serve the wall.
    ports:
      - "${CLIMATE_BIND:-127.0.0.1}:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8090/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    # Measured peak on a running install: about 110 MiB (cgroup memory.peak,
    # page cache included). About 3.5x headroom for the heavier report
    # routes. memswap_limit = mem_limit, as for the poller.
    mem_limit: 384m
    memswap_limit: 384m

volumes:
  climate_pgdata:
