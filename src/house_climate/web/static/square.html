<body class="sq-page">
  <!-- Condensed square tile for the kitchen wall calendar (Apolosign,
       Android kiosk browser). Glanceable only: no charts, no hover. -->
  <div class="sq" id="sq-root" data-state="idle" data-conn="up">

    <header class="sq-head">
      <span class="breath-dot" id="sq-dot" role="status" aria-live="polite" aria-label="connection status"></span>
      <span class="sq-title">House</span>
      <span class="spacer"></span>
      <span class="sq-clock num" id="sq-clock">&mdash;</span>
    </header>

    <section class="sq-hero" id="sq-hero" aria-label="Inside and outside right now">
      <p class="loading">connecting&hellip;</p>
    </section>

    <section class="sq-rooms" id="sq-rooms" aria-label="Rooms"></section>

    <section class="sq-stats num" id="sq-stats" aria-label="Cost and forecast"></section>

    <footer class="sq-foot">
      <span class="sq-band num" id="sq-band">&mdash;</span>
      <span class="spacer"></span>
      <span class="sq-updated num" id="sq-updated">&mdash;</span>
    </footer>

  </div>
  <script src="common.js?v=2"></script>
  <script src="square.js?v=2"></script>
</body>
