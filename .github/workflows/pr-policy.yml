# Shared PR policy from drench44/ci-shared (see its README): the PR body must
# state the review band, a PR that fixes a regression must add or change a
# test, and the diff has a size limit (warn over 800 changed lines, fail over
# 2,500 without a size-override).
name: pr-policy
on:
  pull_request:
    # edited/labeled/unlabeled: the check re-reads the body and labels, so
    # fixing the band line or adding size-override turns it green.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  policy:
    # Pinned to a commit, not @main, so a change to ci-shared reaches this repo
    # only through a PR here. ci-policy-ref must name the same commit: it picks
    # the policy code the job checks out and runs.
    uses: drench44/ci-shared/.github/workflows/pr-policy.yml@dcaa8bd208ec44614eac90700cbe14a10052301c # main @ dcaa8bd
    with:
      ci-policy-ref: dcaa8bd208ec44614eac90700cbe14a10052301c
      # Public repo: GitHub-hosted runner (free for public repos).
      runs-on: '"ubuntu-latest"'
