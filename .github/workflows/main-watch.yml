# Main-branch watchdog from drench44/ci-shared (see its README). On every push
# to main, each new commit must come from a merged PR whose checks were
# green, or match ci-shared's policy/main-allowlist.json. Anything else, and
# any force push or branch deletion, opens one issue labeled main-watch
# (GitHub emails it). It only alerts; it never reverts.
name: main-watch
on:
  push:
    branches: [main]
  # Hourly re-check of commits whose PR checks were still running at merge.
  schedule:
    - cron: 41 * * * *
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  statuses: write
  issues: write
jobs:
  watch:
    # Pinned to a commit, not @main, so a change to ci-shared reaches this repo
    # only through a PR here. ci-policy-ref must name the same commit: it picks
    # the watch code and the allowlist the job checks out.
    uses: drench44/ci-shared/.github/workflows/main-watch.yml@dcaa8bd208ec44614eac90700cbe14a10052301c # main @ dcaa8bd
    with:
      ci-policy-ref: dcaa8bd208ec44614eac90700cbe14a10052301c
      # Public repo: GitHub-hosted runner (free for public repos).
      runs-on: '"ubuntu-latest"'
