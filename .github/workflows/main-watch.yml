# Main-branch watchdog from drench44/ci-policy (see its README). On every push
# to main, each new commit must come from a merged PR whose checks were
# green, or match ci-policy's policy/main-allowlist.json. Anything else, and
# any force push or branch deletion, opens one issue labeled main-watch
# (GitHub emails it). It only alerts; it never reverts.
name: main-watch
on:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  issues: write
jobs:
  watch:
    # Pinned to a commit, not @main, so a change to ci-policy (including its
    # allowlist) reaches this repo only through a PR here. b03c60d is
    # ci-policy main as of 2026-09-23 ("Shared PR policy, main watch, git hooks
    # and homelab deploy (#1)"). ci-policy-ref must name the same commit: it
    # picks the watch code and the allowlist the job checks out.
    uses: drench44/ci-policy/.github/workflows/main-watch.yml@b03c60de2110f69391159ed73d773adc8bfe6d6e # main @ b03c60d
    with:
      ci-policy-ref: b03c60de2110f69391159ed73d773adc8bfe6d6e
      # Public repo: GitHub-hosted runner (free for public repos).
      runs-on: '"ubuntu-latest"'
