# Main-branch watchdog from drench44/ci-policy (see its README). On every push
# to main, each new commit must come from a merged PR whose checks were
# green, or match ci-policy's policy/main-allowlist.json. Anything else, and
# any force push or branch deletion, opens one issue labeled main-watch
# (GitHub emails it). It only alerts; it never reverts.
name: main-watch
on:
  push:
    branches: [main]
  # Hourly re-check of commits whose PR checks were still running at merge.
  schedule:
    - cron: 41 * * * *
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  statuses: write
  issues: write
jobs:
  watch:
    # Pinned to a commit, not @main, so a change to ci-policy (including its
    # allowlist) reaches this repo only through a PR here. 2c990d5 is
    # ci-policy PR #2 (every check green, waits for checks still running at
    # merge, stacked PRs, ci-policy/main-watch commit status for the
    # out-of-band audit). ci-policy-ref must name the same commit: it picks
    # the watch code and the allowlist the job checks out.
    uses: drench44/ci-policy/.github/workflows/main-watch.yml@2c990d56f10ceb29fda3a0da1010fb96f53e0cb8 # main @ 2c990d5
    with:
      ci-policy-ref: 2c990d56f10ceb29fda3a0da1010fb96f53e0cb8
      # Public repo: GitHub-hosted runner (free for public repos).
      runs-on: '"ubuntu-latest"'
