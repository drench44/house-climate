name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Same pinned image as docker-compose.yml — see the comment there for
      # why the tag is nailed down instead of floating.
      # The health check runs a real query over TCP, not pg_isready over the
      # socket: the image runs initdb against a temporary server that answers
      # on the unix socket only and is then shut down, so a socket-based check
      # can hand a job a database that is about to vanish. The backup-restore
      # job below hit exactly that.
      db:
        image: timescale/timescaledb:2.29.1-pg16
        env:
          POSTGRES_USER: climate
          POSTGRES_PASSWORD: climate
          POSTGRES_DB: climate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -h 127.0.0.1 -U climate -d climate -c 'select 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # requirements-dev.txt pulls in requirements.txt plus the test-only deps
      # (pytest, httpx for the FastAPI TestClient) that no longer ship in the
      # runtime images.
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load schema (same initdb scripts docker-compose mounts)
        run: |
          # -v ON_ERROR_STOP=1: without it psql exits 0 even when a statement
          # errors, so a broken aggregates.sql (bad column, Timescale API
          # change) would load "successfully", CI would stay green, and the
          # continuous aggregate would silently not exist. Fail loud instead.
          PGPASSWORD=climate psql -v ON_ERROR_STOP=1 -h localhost -U climate -d climate \
            -f db/init.sql -f db/aggregates.sql
      - run: python -m pytest tests -q
        env:
          PYTHONPATH: src
          CI: "true"
          TEST_DB_DSN: postgresql://climate:climate@localhost:5432/climate
      - run: node --test tests/js/*.mjs

  backup-restore:
    # Exercises the ACTUAL restore path (dump -> restore into a throwaway DB with
    # the TimescaleDB pre/post_restore wrappers -> verify), so a backup that
    # can't be restored fails CI instead of being discovered in an emergency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start TimescaleDB
        run: |
          docker run -d --name hc-db \
            -e POSTGRES_USER=climate -e POSTGRES_PASSWORD=climate -e POSTGRES_DB=climate \
            timescale/timescaledb:2.29.1-pg16
          # pg_isready is not enough: the image runs initdb against a TEMPORARY
          # server, then shuts it down and starts the real one. A command
          # issued in that gap dies with "the database system is shutting
          # down". The entrypoint starts that temporary server with
          # listen_addresses='' — unix socket only — so connecting over TCP
          # makes it invisible and one success is proof, rather than a
          # three-in-a-row heuristic that a fast restart could still straddle.
          ready=
          for i in $(seq 1 60); do
            if docker exec hc-db psql -h 127.0.0.1 -U climate -d climate -tAc 'select 1' \
                 >/dev/null 2>&1; then ready=yes; break; fi
            sleep 2
          done
          [ -n "$ready" ] || { echo "postgres never accepted a TCP connection"; docker logs hc-db; exit 1; }
      - name: Load schema + a sample row
        run: |
          cat db/init.sql db/aggregates.sql \
            | docker exec -i hc-db psql -U climate -d climate -v ON_ERROR_STOP=1 -f -
          # Seed EVERY table the restore check verifies, not just readings.
          # A table that is empty on both sides passes trivially, so with rows
          # in readings alone the job could never catch a restore that dropped
          # every row of sensor_readings or interventions — which is the whole
          # regression this check exists to detect.
          docker exec hc-db psql -U climate -d climate -v ON_ERROR_STOP=1 \
            -c "INSERT INTO devices (device_id, name) VALUES ('dev1', 'test');" \
            -c "INSERT INTO readings (ts, device_id, indoor_temp_f) VALUES (now(), 'dev1', 72.0);" \
            -c "INSERT INTO poll_errors (kind, detail) VALUES ('test', 'seed');" \
            -c "INSERT INTO sensor_readings (ts, sensor_id, temp_f, humidity, dewpoint_f) VALUES (now(), 'ecowitt_crawl', 63.0, 78.0, 56.5);" \
            -c "INSERT INTO precip_daily (day, inches, source) VALUES (current_date, 0.1, 'station');" \
            -c "INSERT INTO interventions (marked_on, label) VALUES (current_date, 'Vapor barrier');" \
            -c "INSERT INTO kv (k, v) VALUES ('seed', '{}'::jsonb);" \
            -c "INSERT INTO filter_events (device_id, note) VALUES ('dev1', 'seed');" \
            -c "INSERT INTO air_readings (ts, room, pm25) VALUES (now(), 'test', 5.0);"
      - name: Restore self-test
        run: HC_DB_CONTAINER=hc-db bash backup/house-climate-backup.sh --restore-selftest

  backup-selftest:
    # Pure-logic contract for the backup + pre-deploy guard scripts (no DB).
    # Fast tripwire so a broken verdict/freshness predicate fails CI without
    # spinning up TimescaleDB.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash backup/house-climate-backup.sh --selftest
      - run: bash backup/require-fresh-backup.sh --selftest
      # Integration coverage for the guard's imperative (deploy-blocking) path
      # against a stubbed backup — uses GNU date, so it runs here, not locally.
      - run: bash backup/require-fresh-backup.sh --gate-selftest

  changelog-guard:
    # A PR that changes app code under src/ must add a CHANGELOG [Unreleased]
    # entry (docs-only / test-only diffs are exempt). Same check as the local
    # .githooks/pre-commit hook.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the PR base commit reachable for the diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_changelog.py --base "$BASE_SHA"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — the sweep covers every commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
